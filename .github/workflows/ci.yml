name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Проверка форматирования
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      # Тесты включают негативные проверки безопасности. Два теста прав
      # доступа пропускаются на Windows и выполняются именно здесь.
      - name: Тесты
        run: go test ./... -count=1

      - name: Покрытие
        run: |
          go test ./... -count=1 -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -1

      - name: Сборка
        run: go build -o bin/cfgtool ./cmd/cfgtool

  analysis:
    name: Статический анализ и зависимости
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # Версии инструментов закреплены: результат проверки должен
      # зависеть от состояния продукта, а не от даты запуска.
      - name: Установка инструментов
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: staticcheck
        run: staticcheck ./...

      - name: Известные уязвимости в зависимостях
        run: govulncheck ./...

      # gosec выдаёт две находки G304 на чтении файла по пути из аргументов
      # командной строки. Это основное назначение продукта; находки
      # разобраны и приняты как остаточный риск, см. project.md.
      # Шаг не блокирует сборку, но отчёт сохраняется как артефакт.
      - name: gosec (информационно)
        continue-on-error: true
        run: gosec -fmt=text -color=false -out=gosec.txt -stdout ./...

      - name: Сохранение отчёта gosec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec-report
          path: gosec.txt
          if-no-files-found: warn
