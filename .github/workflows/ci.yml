name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Проверка форматирования
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: Тесты
        run: go test ./... -count=1

      - name: Сборка
        run: go build -o bin/cfgtool ./cmd/cfgtool
